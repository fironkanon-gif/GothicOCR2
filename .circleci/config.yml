version: 2.1

jobs:
  build_android:
    docker:
      - image: cimg/android:2026.08-ndk

    resource_class: large

    steps:
      - checkout

      - run:
          name: Check environment
          command: |
            set -eux
            pwd
            ls -la
            python3 --version
            java -version
            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
            command -v sdkmanager || true

      - run:
          name: Install system dependencies
          command: |
            set -eux
            sudo apt-get update
            sudo apt-get install -y \
              python3-venv \
              python3-dev \
              python3-pip \
              git \
              zip \
              unzip \
              autoconf \
              automake \
              libtool \
              pkg-config \
              zlib1g-dev \
              libncurses5-dev \
              libncursesw5-dev \
              libffi-dev \
              libssl-dev \
              cmake

      - run:
          name: Create Python virtual environment
          command: |
            set -eux
            python3 -m venv ~/buildozer-venv
            ~/buildozer-venv/bin/python -m pip install --upgrade pip setuptools wheel
            ~/buildozer-venv/bin/python -m pip install buildozer==1.6.0
            ~/buildozer-venv/bin/buildozer --version

      - run:
          name: Validate project files
          command: |
            set -eux

            test -f main.py
            test -f buildozer.spec
            test -f models/gothic_ocr.tflite
            test -f data/labels.json
            test -f fonts/NotoSansGothic-Regular.ttf

            test -f services/__init__.py
            test -f services/image_service.py
            test -f services/model_service.py
            test -f services/text_decoder.py

            echo "Project files validation: OK"

      - run:
          name: Validate Python syntax
          command: |
            set -eux
            ~/buildozer-venv/bin/python -m compileall -q main.py services tests
            echo "Python syntax validation: OK"

      - run:
          name: Validate Buildozer configuration
          command: |
            set -eux

            ~/buildozer-venv/bin/buildozer --version

            echo "Buildozer configuration:"
            grep -E \
              '^(title|package.name|package.domain|version|source.dir|requirements|android.api|android.minapi|android.archs|android.ndk)' \
              buildozer.spec || true

      - run:
          name: Validate Android SDK
          command: |
            set -eux

            echo "ANDROID_HOME=${ANDROID_HOME:-}"
            echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

            if command -v sdkmanager >/dev/null 2>&1; then
              sdkmanager --version
            else
              echo "sdkmanager not found in PATH"
            fi

      - run:
          name: Build Android APK
          command: |
            set -eux

            ~/buildozer-venv/bin/buildozer android debug

      - run:
          name: Verify generated APK
          command: |
            set -eux

            echo "APK files:"
            find bin -type f -name "*.apk" -print

            APK_COUNT=$(find bin -type f -name "*.apk" | wc -l)

            if [ "$APK_COUNT" -lt 1 ]; then
              echo "ERROR: No APK was generated"
              exit 1
            fi

      - store_artifacts:
          path: bin
          destination: gothicocr-apk

workflows:
  build_android_workflow:
    jobs:
      - build_android
